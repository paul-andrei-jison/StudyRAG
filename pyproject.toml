[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studybuddy"
version = "0.1.0"
description = "Private study assistant: photograph handouts, index them, ask questions with citations."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
studybuddy = ["ui/theme.css"]
